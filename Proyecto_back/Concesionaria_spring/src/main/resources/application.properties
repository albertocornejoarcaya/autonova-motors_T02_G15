# ---------------------------------------------------------------
# AutoNova Motors - Backend Spring Boot
# Base de datos: H2 embebida en archivo (./data/concesionaria.mv.db)
# No requiere instalar ningún motor de base de datos.
# ---------------------------------------------------------------
spring.application.name=concesionaria-backend
server.port=8081
server.address=127.0.0.1
server.servlet.session.timeout=8h
server.error.include-message=always

spring.datasource.url=jdbc:h2:file:./data/concesionaria;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web de H2 para revisar las tablas: http://127.0.0.1:8081/h2-console
# JDBC URL: jdbc:h2:file:./data/concesionaria  | Usuario: sa | Contraseña: (vacía)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Orígenes permitidos si Angular llama a la API sin el proxy de desarrollo
app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html